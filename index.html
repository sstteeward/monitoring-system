<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIL Monitoring System</title>
  <script>
    // Apply theme before React mounts to prevent flash of wrong theme
    (function () {
      try {
        // Light is the default; only a stored choice moves it. Mirrors
        // resolveTheme() in src/contexts/ThemeContext.tsx — keep them in step.
        var saved = null;
        var authKeys = Object.keys(localStorage).filter(function(k) { return k.startsWith('sb-') && k.endsWith('-auth-token'); });
        if (authKeys.length > 0) {
          var authData = JSON.parse(localStorage.getItem(authKeys[0]));
          var userId = authData && authData.user ? authData.user.id : null;
          if (userId) {
            saved = localStorage.getItem('cd-theme-' + userId);
          }
        } else {
          // Signed-out visitors share one preference; without this a guest who
          // picked dark sees a light flash on every load.
          saved = localStorage.getItem('cd-theme-guest');
        }
        var theme = (saved === 'light' || saved === 'dark') ? saved : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
