<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asian College SIL Monitoring System</title>
    <style>body{margin:0;display:grid;min-height:100vh;place-items:center;background:#f8fafc;color:#0f172a;font:15px system-ui,sans-serif}main{text-align:center}strong{display:block;color:#059669;font-size:1.05rem}span{display:block;margin-bottom:.45rem;color:#64748b;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}</style>
  </head>
  <body>
    <main><span>Asian College SIL Monitoring System</span><strong id="title">Google Calendar connected</strong><p id="message">This window will close automatically.</p></main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const connected = params.get('status') !== 'error';
      const reason = params.get('reason');
      if (!connected) {
        document.getElementById('title').textContent = 'Google Calendar Connection Failed';
        document.getElementById('title').style.color = '#dc2626';
        document.getElementById('message').innerHTML = (reason ? `<strong>Error Details:</strong><br><code>${reason}</code>` : 'Connection could not be saved.') + '<br><br><button onclick="window.close()" style="padding:8px 16px;background:#0f172a;color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600">Close Window</button>';
      }
      try {
        if (window.opener) window.opener.postMessage({ type: connected ? 'google-calendar-connected' : 'google-calendar-error', reason }, '*');
      } catch (e) {
        console.error('Failed to post message to opener', e);
      }
      if (connected) {
        window.setTimeout(() => window.close(), 1000);
      }
    </script>
  </body>
</html>
