
[functions.corbado-auth]
enabled = true
verify_jwt = true
import_map = "./functions/corbado-auth/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/corbado-auth/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/corbado-auth/*.html" ]

[functions.web-push-notification]
enabled = true
# The database webhook authenticates with the project service-role key. The
# function checks that header itself so it can accept both legacy JWT and new
# opaque service keys.
verify_jwt = false
entrypoint = "./functions/web-push-notification/index.ts"

[functions.notification-email]
enabled = true
# This function accepts only database-webhook requests authenticated with the
# project's legacy service-role key, which it verifies inside the handler.
verify_jwt = false
entrypoint = "./functions/notification-email/index.ts"

[functions.google-calendar]
enabled = true
# Google redirects the browser here without a Supabase JWT. The function
# verifies the signed OAuth state for GET callbacks and validates the caller's
# JWT itself for every POST action.
verify_jwt = false
entrypoint = "./functions/google-calendar/index.ts"

[functions.set-signup-password]
enabled = true
# The handler verifies the current user's bearer token before setting a password.
verify_jwt = false
entrypoint = "./functions/set-signup-password/index.ts"

[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "Asian College SIL Monitoring System"
rp_id = "asiancollegesilmonitoringsystem.vercel.app"
rp_origins = ["https://asiancollegesilmonitoringsystem.vercel.app"]
